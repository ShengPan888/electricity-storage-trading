<text x="839" y="181" font-size="16" fill="#29485b">训练侧早停后完整重拟合</text>
<text x="839" y="214" font-size="16" fill="#29485b">5 / 8 / 11月，共92日</text>
<rect x="815" y="345" width="345" height="160" rx="12" fill="white" stroke="#cfdee8"/>
<rect x="815" y="345" width="6" height="160" rx="3" fill="#245c85"/>
