<text x="449" y="214" font-size="16" fill="#29485b">LightGBM + CatBoost等权</text>
<rect x="815" y="100" width="345" height="160" rx="12" fill="white" stroke="#cfdee8"/>
<rect x="815" y="100" width="6" height="160" rx="3" fill="#245c85"/>
