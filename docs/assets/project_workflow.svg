<text x="839" y="426" font-size="16" fill="#29485b">96点 → 连续8点窗口</text>
<text x="839" y="459" font-size="16" fill="#29485b">3321种合法组合 + 不交易</text>
<rect x="425" y="345" width="345" height="160" rx="12" fill="white" stroke="#cfdee8"/>
