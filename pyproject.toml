[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "electricity-storage-trading"
version = "0.1.0"
description = "Reproducible storage arbitrage experiments for the Mengxi electricity competition"
requires-python = ">=3.10"
dependencies = []
license = {file = "LICENSE"}
readme = "README.md"

[project.optional-dependencies]
model = ["numpy==2.2.4", "pandas==2.2.3", "lightgbm==4.6.0"]

[project.scripts]
storage-trading = "storage_trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
storage_trading = ["dashboard.html", "demo_config.json"]
